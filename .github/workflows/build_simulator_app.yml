name: Build Simulator App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-simulator-app:
    runs-on: macos-15
    timeout-minutes: 180
    permissions:
      actions: write
      contents: read

    env:
      WORKSPACE: JobsSwiftBaseConfigDemo.xcworkspace
      SCHEME: JobsSwiftBaseConfigDemo
      CONFIGURATION: Debug
      SDK: iphonesimulator

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select Xcode 26 SDK
        run: |
          selected_developer_dir=""

          if [[ -n "${XCODE_26_DEVELOPER_DIR:-}" && -d "${XCODE_26_DEVELOPER_DIR}" ]]; then
            selected_developer_dir="${XCODE_26_DEVELOPER_DIR}"
          else
            latest_xcode="$(ruby -e 'puts Dir.glob("/Applications/Xcode_26*.app").max_by { |path| Gem::Version.new(File.basename(path)[/\d+(?:\.\d+)*/, 0]) }')"
            if [[ -n "${latest_xcode}" ]]; then
              selected_developer_dir="${latest_xcode}/Contents/Developer"
            fi
          fi

          if [[ -n "${selected_developer_dir}" ]]; then
            export DEVELOPER_DIR="${selected_developer_dir}"
            echo "DEVELOPER_DIR=${DEVELOPER_DIR}" >> "${GITHUB_ENV}"
          else
            echo "::error::Xcode 26 is required but is not installed on this runner."
            exit 1
          fi

          xcode_version="$(xcodebuild -version)"
          echo "${xcode_version}"
          grep -Eq '^Xcode 26([.]|$)' <<< "${xcode_version}"
          xcode-select -p

      - name: Show build environment
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p
          pod --version

      - name: Prepare test Simulator
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          ruby .github/tests/SimulatorRuntime/selection_regression.rb
          xcrun --sdk iphonesimulator --show-sdk-version | tee "${RUNNER_TEMP}/simulator-sdk-version.txt"
          xcrun simctl list runtimes -j > "${RUNNER_TEMP}/simulator-runtimes.json"
          xcrun simctl list devices available -j > "${RUNNER_TEMP}/simulator-devices.json"
          ruby .github/tests/SimulatorRuntime/select_simulator.rb \
            "$(cat "${RUNNER_TEMP}/simulator-sdk-version.txt")" \
            "${RUNNER_TEMP}/simulator-runtimes.json" \
            "${RUNNER_TEMP}/simulator-devices.json" \
            > "${RUNNER_TEMP}/simulator-selection.env"
          cat "${RUNNER_TEMP}/simulator-selection.env" >> "${GITHUB_ENV}"
          simulator_id="$(sed -n 's/^SIMULATOR_ID=//p' "${RUNNER_TEMP}/simulator-selection.env")"
          xcrun simctl bootstatus "${simulator_id}" -b

          simulator_sdk_path="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          probe_path="${RUNNER_TEMP}/WebKitRuntimeProbe"
          xcrun --sdk iphonesimulator swiftc -swift-version 5 -Onone \
            -target arm64-apple-ios15.6-simulator -sdk "${simulator_sdk_path}" \
            -framework WebKit \
            .github/tests/SimulatorRuntime/WebKitRuntimeProbe.swift -o "${probe_path}" \
            2>&1 | tee "${RUNNER_TEMP}/webkit-runtime-probe.log"
          xcrun otool -L "${probe_path}" | tee "${RUNNER_TEMP}/webkit-runtime-probe-dependencies.log"
          xcrun simctl spawn "${simulator_id}" "${probe_path}" \
            2>&1 | tee -a "${RUNNER_TEMP}/webkit-runtime-probe.log"

      - name: Verify JobsSwiftBlock factory and callback regressions
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          echo "Validate JobsSwiftBlock factory types, callback storage, and both Simulator architectures."
          regression_dir="$(mktemp -d "${RUNNER_TEMP}/JobsSwiftBlockRegression.XXXXXX")"
          block_dir="JobsByPods/JobsSwiftBlock@Pods"

          xcrun swiftc -swift-version 5 -Onone -emit-library -emit-module \
            -module-name JobsSwiftBlock \
            "${block_dir}/NSObject+Make.swift" "${block_dir}/JobsCallbackable.swift" \
            -emit-module-path "${regression_dir}/JobsSwiftBlock.swiftmodule" \
            -o "${regression_dir}/libJobsSwiftBlock.dylib"
          xcrun swiftc -swift-version 5 -Onone -parse-as-library \
            -I "${regression_dir}" -L "${regression_dir}" -lJobsSwiftBlock \
            .github/tests/JobsSwiftBlockRegression.swift \
            -o "${regression_dir}/JobsSwiftBlockRegression"
          "${regression_dir}/JobsSwiftBlockRegression"

          simulator_sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          for simulator_arch in arm64 x86_64; do
            echo "Generate JobsCallbackable IR for ${simulator_arch}."
            xcrun swiftc -frontend -emit-ir -Onone -swift-version 5 \
              -profile-generate -profile-coverage-mapping \
              -target "${simulator_arch}-apple-ios15.0-simulator" -sdk "${simulator_sdk}" \
              -module-name JobsSwiftBlock \
              -primary-file "${block_dir}/JobsCallbackable.swift" \
              "${block_dir}/NSObject+Make.swift" \
              -o "${regression_dir}/JobsCallbackable-${simulator_arch}.ll"
          done

      - name: Install CocoaPods dependencies
        timeout-minutes: 20
        env:
          JOBS_FLUTTER_AUTO_SETUP: "1"
        run: |
          set -euo pipefail
          (pod install --no-repo-update || pod install --repo-update) \
            2>&1 | tee "${RUNNER_TEMP}/pod-install.log"

      - name: Verify owned Pod behavior regressions
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          ruby .github/tests/JobsPodsUpgrade/Core/run_regressions.rb \
            --output "${RUNNER_TEMP}/JobsPodsCoreRegression"
          ruby .github/tests/JobsPodsUpgrade/Network/run_regressions.rb \
            --output-dir "${RUNNER_TEMP}/JobsPodsNetworkRegression"

      - name: Skip Jobs local Xcode build timer hook in CI
        run: |
          sudo mkdir -p /Users/jobs/.xcode-build-timer
          sudo tee /Users/jobs/.xcode-build-timer/xbt-build-hook.sh >/dev/null <<'SCRIPT'
          #!/bin/sh
          echo "CI packaging skips Jobs local Xcode build timer hook: $*"
          exit 0
          SCRIPT
          sudo chmod +x /Users/jobs/.xcode-build-timer/xbt-build-hook.sh

      - name: Build every owned Pod
        timeout-minutes: 60
        shell: bash
        run: |
          set -euo pipefail
          ruby .github/tests/JobsPodsUpgrade/validate_builds.rb \
            --skip-host --output-dir "${RUNNER_TEMP}/JobsPodsUnitBuilds" \
            --derived-data "${RUNNER_TEMP}/DerivedData"

      - name: Build Simulator app and test bundle
        id: build
        timeout-minutes: 45
        shell: bash
        run: |
          set -euo pipefail
          derived_data_path="${RUNNER_TEMP}/DerivedData"

          xcodebuild \
            -workspace "${WORKSPACE}" \
            -scheme "${SCHEME}" \
            -configuration "${CONFIGURATION}" \
            -sdk "${SDK}" \
            -destination "${SIMULATOR_DESTINATION}" \
            -jobs 2 \
            -derivedDataPath "${derived_data_path}" \
            SYMROOT="${derived_data_path}/Build/Products" \
            OBJROOT="${derived_data_path}/Build/Intermediates.noindex" \
            OTHER_SWIFT_FLAGS='$(inherited) -j1' \
            -resultBundlePath "${RUNNER_TEMP}/SimulatorBuild.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET=15.6 \
            ONLY_ACTIVE_ARCH=YES ARCHS=arm64 \
            -only-testing:JobsSwiftBaseConfigDemoTests \
            build-for-testing 2>&1 | tee "${RUNNER_TEMP}/simulator-build.log"

      - name: Run hosted UIKit and timer regressions
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -workspace "${WORKSPACE}" -scheme "${SCHEME}" \
            -configuration Debug -sdk iphonesimulator \
            -destination "${SIMULATOR_DESTINATION}" \
            -jobs 2 \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData" \
            SYMROOT="${RUNNER_TEMP}/DerivedData/Build/Products" \
            OBJROOT="${RUNNER_TEMP}/DerivedData/Build/Intermediates.noindex" \
            OTHER_SWIFT_FLAGS='$(inherited) -j1' \
            -resultBundlePath "${RUNNER_TEMP}/JobsPodsTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET=15.6 ONLY_ACTIVE_ARCH=YES ARCHS=arm64 \
            -parallel-testing-enabled NO \
            -only-testing:JobsSwiftBaseConfigDemoTests test-without-building \
            2>&1 | tee "${RUNNER_TEMP}/jobs-pods-tests.log"

      - name: Upload failed build diagnostics
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Simulator-Build-Diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pod-install.log
            ${{ runner.temp }}/simulator-sdk-version.txt
            ${{ runner.temp }}/simulator-runtimes.json
            ${{ runner.temp }}/simulator-devices.json
            ${{ runner.temp }}/simulator-selection.env
            ${{ runner.temp }}/webkit-runtime-probe.log
            ${{ runner.temp }}/webkit-runtime-probe-dependencies.log
            ${{ runner.temp }}/simulator-build.log
            ${{ runner.temp }}/SimulatorBuild.xcresult
            ${{ runner.temp }}/JobsPodsUnitBuilds
            ${{ runner.temp }}/JobsPodsCoreRegression
            ${{ runner.temp }}/JobsPodsNetworkRegression
            ${{ runner.temp }}/JobsPodsTests.xcresult
            ${{ runner.temp }}/jobs-pods-tests.log
          if-no-files-found: warn
          retention-days: 7

      - name: Package Simulator app
        id: package
        run: |
          derived_data_path="${RUNNER_TEMP}/DerivedData"
          app_output_dir="${RUNNER_TEMP}/SimulatorApp"
          products_dir="${derived_data_path}/Build/Products/${CONFIGURATION}-iphonesimulator"
          app_path="${products_dir}/${SCHEME}.app"

          if [[ ! -d "${app_path}" || ! -f "${app_path}/Info.plist" ]]; then
            echo "::error::Main app product not found: ${app_path}"
            exit 1
          fi

          app_bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${app_path}/Info.plist")"
          app_executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${app_path}/Info.plist")"
          if [[ -z "${app_bundle_id}" || "${app_bundle_id}" == *.xctrunner || "${app_executable}" != "${SCHEME}" || ! -f "${app_path}/${app_executable}" ]]; then
            echo "::error::Invalid main app identity: ${app_bundle_id} / ${app_executable}"
            exit 1
          fi
          echo "Packaging main app: ${app_path} (${app_bundle_id})"

          mkdir -p "${app_output_dir}"
          safe_ref="${GITHUB_REF_NAME//\//-}"
          artifact_name="${SCHEME}-Latest-Simulator.app-${safe_ref}"
          legacy_artifact_prefix="${SCHEME}-Simulator.app-${safe_ref}-"
          artifact_zip="${app_output_dir}/${artifact_name}.zip"

          ditto -c -k --keepParent "${app_path}" "${artifact_zip}"

          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"
          echo "legacy_artifact_prefix=${legacy_artifact_prefix}" >> "${GITHUB_OUTPUT}"
          echo "artifact_zip=${artifact_zip}" >> "${GITHUB_OUTPUT}"

      - name: Delete previous Simulator app artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ steps.package.outputs.artifact_name }}
          LEGACY_ARTIFACT_PREFIX: ${{ steps.package.outputs.legacy_artifact_prefix }}
        run: |
          artifact_ids="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
              --jq '.artifacts[] | select(.expired == false and (.name == env.ARTIFACT_NAME or (.name | startswith(env.LEGACY_ARTIFACT_PREFIX)))) | .id'
          )"

          if [[ -z "${artifact_ids}" ]]; then
            echo "No previous Simulator app artifacts found."
            exit 0
          fi

          while IFS= read -r artifact_id; do
            [[ -z "${artifact_id}" ]] && continue
            echo "Deleting previous artifact id ${artifact_id}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done <<< "${artifact_ids}"

      - name: Upload Simulator app
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.artifact_zip }}
          if-no-files-found: error
          retention-days: 14
