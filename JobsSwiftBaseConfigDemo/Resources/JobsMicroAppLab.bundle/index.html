<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#f2f2f7"><title data-jobs-i18n="Jobs 离线学习包">Jobs 离线学习包</title><style>
:root{--bg:#f2f2f7;--fg:#17171b;--muted:#45454e;color-scheme:light}
html[data-theme=dark]{--bg:#1c1c1e;--fg:#f6f6f8;--muted:#c8c8d0;color-scheme:dark}
*{box-sizing:border-box}
body{font:16px/1.5 -apple-system,sans-serif;font:-apple-system-body;background:var(--bg);color:var(--fg);margin:0;padding:16px;overflow-wrap:anywhere}
h2{font-size:1.25em;margin:0 0 8px}
p{color:var(--muted);line-height:1.5;margin:12px 0}
.counter-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:16px 0}
button{font:inherit;line-height:1.4;max-width:100%;min-height:44px;color:var(--fg);background:var(--bg);border:1px solid #888;border-radius:8px;padding:12px;white-space:normal;overflow-wrap:anywhere}
#count{min-width:2ch;font-variant-numeric:tabular-nums}
#status{white-space:pre-wrap;font-size:0.875em;overflow-wrap:anywhere}
</style><script>
// Jobs-owned lesson UI only; API names, URLs, and user drafts are never translated.
window.jobsT = key => window.jobsWebLocalization?.strings?.[key] ?? key;
window.jobsTF = (key, ...values) => {
  let i = 0;
  return window.jobsT(key).replace(/%@|%d/g, () => String(values[i++] ?? ''));
};
window.jobsSetLocalization = payload => {
  window.jobsWebLocalization = payload;
  document.documentElement.lang = payload.language || 'en';
  document.querySelectorAll('[data-jobs-i18n]').forEach(el => {
    el.textContent = window.jobsT(el.dataset.jobsI18n);
  });
  document.querySelectorAll('[data-jobs-i18n-aria]').forEach(el => {
    el.setAttribute('aria-label', window.jobsT(el.dataset.jobsI18nAria));
  });
  document.querySelectorAll('[data-jobs-i18n-value]').forEach(el => {
    const next = window.jobsT(el.dataset.jobsI18nValue);
    if (el.dataset.jobsPreviousValue === undefined || el.value === el.dataset.jobsPreviousValue) {
      el.value = next;
    }
    el.dataset.jobsPreviousValue = next;
  });
  window.jobsRenderLocalized?.();
};
document.addEventListener('DOMContentLoaded', () => {
  if (window.jobsWebLocalization) window.jobsSetLocalization(window.jobsWebLocalization);
});
</script></head>
<body><h2 data-jobs-i18n="Jobs 离线学习包 · v2">Jobs 离线学习包 · v2</h2><p data-jobs-i18n="这段文字与按钮来自本地 HTML。Native bundle 模式断网可用；部署到 HTTPS/localhost 后才尝试注册真正的 Service Worker。">这段文字与按钮来自本地 HTML。Native bundle 模式断网可用；部署到 HTTPS/localhost 后才尝试注册真正的 Service Worker。</p>
<div class="counter-actions"><button onclick="increment()" data-jobs-i18n="离线交互 +1">离线交互 +1</button><span id="count" aria-live="polite">0</span></div>
<p id="status" role="status">正在检查运行来源…</p>
<script>
let count=0;
window.increment=()=>{document.getElementById('count').textContent=String(++count);};
// file:// 不支持 Service Worker；同一资源包也可部署到自有 HTTPS 或开发 localhost。
let statusKey='正在检查运行来源…';
let statusArgs=[];
window.jobsRenderLocalized=()=>{document.getElementById('status').textContent=jobsTF(statusKey,...statusArgs);};
function showStatus(key,...args){statusKey=key;statusArgs=args;window.jobsRenderLocalized();}
async function boot(){
  if(!/^https?:$/.test(location.protocol)){showStatus('Native bundled 离线包\nfile:// 不注册 Service Worker');return;}
  if(!('serviceWorker' in navigator)){showStatus('当前浏览器/容器未开放 Service Worker API');return;}
  try{
    const registration=await navigator.serviceWorker.register('./sw.js',{scope:'./'});
    await navigator.serviceWorker.ready;
    showStatus('SW 已注册：%@',registration.scope);
    document.getElementById('status').textContent+='\n'+jobsT(navigator.serviceWorker.controller?'已受 SW 控制，可断网刷新':'首次安装完成，等待 controllerchange 或再次刷新');
    navigator.serviceWorker.addEventListener('controllerchange',()=>{showStatus('SW controller 已生效，可断网普通刷新验证缓存');});
  }catch(error){showStatus('SW 注册失败：%@',error.message);}
}
boot();
</script></body></html>
