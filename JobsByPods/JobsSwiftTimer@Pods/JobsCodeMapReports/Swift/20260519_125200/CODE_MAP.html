<script>
const data = JSON.parse(document.getElementById('code-map-data').textContent);
const app = document.getElementById('app');
const componentNav = document.getElementById('componentNav');
const searchBox = document.getElementById('searchBox');
const state = {view:'overview', selected:null, query:'', graphScope:'all', graphConfidence:'all', graphZoom:1, graphEdgeIndex:null};
const compById = Object.fromEntries((data.components||[]).map(c=>[c.id,c]));
function esc(s){return String(s ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function chip(text, cls=''){return `<span class="chip ${cls}">${esc(text)}</span>`}
function loc(x){return `<code>${esc(x.file||'')}:${esc(x.line||'')}</code>`}
function setView(view, selected=null, push=true){state.view=view;state.selected=selected;if(view!=='graph'){state.graphEdgeIndex=null;state.graphScope='all';state.graphZoom=1;}document.querySelectorAll('.navBtn[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(push){const hash=selected?`#${view}/${encodeURIComponent(selected)}`:`#${view}`;history.pushState({view,selected},'',hash);}render();}
window.addEventListener('popstate',()=>{readHash(false)});
function readHash(push=false){const h=decodeURIComponent(location.hash.replace(/^#/,''));if(!h){setView('overview',null,push);return;}const [v,id]=h.split('/');setView(v||'overview',id||null,push)}
function renderNav(){const q=state.query.toLowerCase();const comps=(data.components||[]).filter(c=>!q||(`${c.name} ${c.kind} ${c.file} ${(c.methods||[]).map(m=>m.name).join(' ')}`).toLowerCase().includes(q)).slice(0,80);componentNav.innerHTML=comps.map(c=>`<button class="navBtn ${(state.selected===c.id&&['component','graph'].includes(state.view))?'active':''}" data-component="${esc(c.id)}">${esc(c.name)}<span class="meta">${esc(c.kind)} · ${esc(c.file)}:${esc(c.line)}</span></button>`).join('')||'<div class="empty">没有匹配的零部件。</div>';componentNav.querySelectorAll('[data-component]').forEach(btn=>btn.onclick=()=>setView('component',btn.dataset.component));}
searchBox.addEventListener('input',e=>{state.query=e.target.value;renderNav();if(state.view==='overview')render();});
document.querySelectorAll('.navBtn[data-view]').forEach(btn=>btn.onclick=()=>setView(btn.dataset.view));
function hero(){const h=data.human_overview||{};return `<section class="hero"><h2>${esc(h.project_name||'Code Map')}</h2><p>${esc(h.one_sentence||'静态代码地图')}</p><p class="mini">扫描时间：${esc(data.created_at)} · 语言：${esc(data.language)} · 事实源：CODE_GRAPH.json</p><div class="toolbar"><button class="primary" onclick="setView('graph')">打开交互流程图</button><button class="ghost" onclick="setView('relations')">查看关系证据</button><button class="ghost" onclick="setView('files')">查看文件清单</button></div></section>`}
function renderOverview(){const s=data.summary||{};const h=data.human_overview||{};const stats=Object.entries(s).map(([k,v])=>`<div class="card stat"><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join('');const q=state.query.toLowerCase();const comps=(data.components||[]).filter(c=>!q||(`${c.name} ${c.kind} ${c.file} ${c.role}`).toLowerCase().includes(q)).slice(0,12);app.innerHTML=hero()+`<div class="grid stats">${stats}</div><section class="section card"><h3>新人阅读路线</h3>${(h.reading_path||[]).map(x=>`<p>➤ ${esc(x)}</p>`).join('')}<div class="chips">${(h.key_components||[]).map(x=>chip(x,'ok')).join('')}</div></section><section class="section"><h3>核心零部件</h3><div class="grid componentGrid">${comps.map(componentCard).join('')}</div></section><section class="section card"><h3>静态扫描边界</h3><p class="muted">${esc(h.static_boundary||'静态扫描无法覆盖所有运行时关系。')}</p></section>`;bindComponentCards();}
function componentCard(c){return `<article class="card componentCard" data-component="${esc(c.id)}"><h4>${esc(c.name)}</h4><div class="chips">${chip(c.kind)}${chip((c.methods||[]).length+' methods')}${chip((c.properties||[]).length+' props')}</div><p class="muted">${esc(c.role)}</p><p class="mini"><code>${esc(c.file)}:${esc(c.line)}</code></p><div class="panelActionRow"><button class="miniBtn" onclick="event.stopPropagation();setView('graph','${esc(c.id)}')">在流程图里看它</button></div></article>`}
function bindComponentCards(){document.querySelectorAll('[data-component]').forEach(el=>el.onclick=()=>setView('component',el.dataset.component));}
function renderComponent(id){const c=compById[id];if(!c){app.innerHTML=hero()+`<div class="empty">找不到这个零部件。</div>`;return;}const incoming=(c.incoming||[]).map(edgeRow).join('')||'<tr><td colspan="5" class="muted">暂无。</td></tr>';const outgoing=(c.outgoing||[]).map(edgeRow).join('')||'<tr><td colspan="5" class="muted">暂无。</td></tr>';const methods=(c.methods||[]).map(m=>`<tr><td><code>${esc(m.name)}</code></td><td>${esc(m.type)}</td><td>${loc(m)}</td><td class="mini">${esc(m.signature)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">暂无。</td></tr>';const props=(c.properties||[]).map(p=>`<tr><td><code>${esc(p.name)}</code></td><td>${esc(p.kind)}</td><td><code>${esc(p.value_type||'')}</code></td><td>${loc(p)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">暂无。</td></tr>';app.innerHTML=`<section class="card"><div class="detailHeader"><div><h2>${esc(c.name)}</h2><div class="chips">${chip(c.kind)}${chip(c.file+':'+c.line)}${chip((c.incoming||[]).length+' incoming')}${chip((c.outgoing||[]).length+' outgoing')}</div></div><div class="panelActionRow"><button class="soft" onclick="setView('graph','${esc(c.id)}')">在流程图里看它</button><button class="backBtn" onclick="history.back()">← 退回上一层</button></div></div><p>${esc(c.role)}</p><div class="evidence"><code>${esc(c.signature||'')}</code></div></section><section class="section twoCol"><div class="card"><h3>谁调用 / 依赖它</h3><table class="table"><tr><th>来源</th><th>关系</th><th>置信度</th><th>位置</th><th>证据</th></tr>${incoming}</table></div><div class="card"><h3>它调用 / 依赖谁</h3><table class="table"><tr><th>目标</th><th>关系</th><th>置信度</th><th>位置</th><th>证据</th></tr>${outgoing}</table></div></section><section class="section twoCol"><div class="card"><h3>方法</h3><table class="table"><tr><th>符号</th><th>类型</th><th>位置</th><th>签名</th></tr>${methods}</table></div><div class="card"><h3>属性</h3><table class="table"><tr><th>名称</th><th>类型</th><th>值类型</th><th>位置</th></tr>${props}</table></div></section>`;}
function edgeRow(e){const from=compById[e.from]?.name||e.from;const to=compById[e.to]?.name||e.to;const selectedId=state.selected;const other=(selectedId===e.to)?from:to;const otherId=(selectedId===e.to)?e.from:e.to;return `<tr><td><button class="backBtn" onclick="setView('component','${esc(otherId)}')">${esc(other)}</button></td><td>${chip(e.type)}</td><td>${chip(e.confidence,e.confidence==='unknown'||e.confidence==='runtime'?'warn':'ok')}</td><td>${loc(e)}</td><td class="mini">${esc(e.evidence||'')}</td></tr>`}
function graphKind(c, indeg, outdeg){if(indeg[c.id]===0&&outdeg[c.id]>0)return 'entry';if(outdeg[c.id]===0&&indeg[c.id]>0)return 'output';if(/Manager|Protocol|Config|State|Defs/.test(c.name))return 'core';return 'core';}
function sortByDegree(comps, edges){const inMap=Object.fromEntries(comps.map(c=>[c.id,0]));const outMap=Object.fromEntries(comps.map(c=>[c.id,0]));edges.forEach(e=>{if(inMap[e.to]!==undefined)inMap[e.to]+=1;if(outMap[e.from]!==undefined)outMap[e.from]+=1});return comps.slice().sort((a,b)=>((inMap[b.id]+outMap[b.id])-(inMap[a.id]+outMap[a.id]))||a.name.localeCompare(b.name));}
function getGraphData(){let comps=(data.components||[]).slice();let edges=(data.component_edges||[]).filter(e=>compById[e.from]&&compById[e.to]);if(state.query){const q=state.query.toLowerCase();comps=comps.filter(c=>(`${c.name} ${c.kind} ${c.file} ${c.role}`).toLowerCase().includes(q));const ids=new Set(comps.map(c=>c.id));edges=edges.filter(e=>ids.has(e.from)||ids.has(e.to));const plus=new Set();edges.forEach(e=>{if(ids.has(e.from)||ids.has(e.to)){plus.add(e.from);plus.add(e.to);}});comps=(data.components||[]).filter(c=>plus.has(c.id));}
if(state.graphConfidence!=='all'){edges=edges.filter(e=>e.confidence===state.graphConfidence);}const ids=new Set(comps.map(c=>c.id));edges=edges.filter(e=>ids.has(e.from)&&ids.has(e.to));comps=sortByDegree(comps, edges).slice(0,40);const topIds=new Set(comps.map(c=>c.id));edges=edges.filter(e=>topIds.has(e.from)&&topIds.has(e.to)).slice(0,120);
if(state.selected&&state.graphScope==='focus'&&topIds.has(state.selected)){const nbr=new Set([state.selected]);edges.forEach(e=>{if(e.from===state.selected||e.to===state.selected){nbr.add(e.from);nbr.add(e.to);}});comps=comps.filter(c=>nbr.has(c.id));const allowed=new Set(comps.map(c=>c.id));edges=edges.filter(e=>allowed.has(e.from)&&allowed.has(e.to));}
return {comps,edges};}
function renderGraph(){const hasFocus=!!state.selected;app.innerHTML=hero()+`<section class="section graphShell"><div class="card graphCard"><div class="graphTopBar"><div><h3>交互流程图</h3><p class="muted">点击节点查看它的角色、上下游和入口方法；点击右侧按钮再进入组件详情。点击边可看这条关系的源码证据。</p></div><div class="graphControls"><select id="graphConfidence"><option value="all">全部关系</option><option value="direct">只看 direct</option><option value="structural">只看 structural</option></select><button class="miniBtn" id="zoomOutBtn">缩小</button><button class="miniBtn" id="zoomInBtn">放大</button><button class="miniBtn" id="zoomResetBtn">重置缩放</button>${hasFocus?`<button class="miniBtn" id="focusToggleBtn">${state.graphScope==='focus'?'恢复全图':'只看它的一跳上下游'}</button>`:''}${hasFocus?`<button class="miniBtn" id="clearFocusBtn">取消当前焦点</button>`:''}</div></div><div class="graphLegend"><span class="legendItem"><i class="legendDot entry"></i>可能是入口 / 发起方</span><span class="legendItem"><i class="legendDot core"></i>中间协调 / 核心能力</span><span class="legendItem"><i class="legendDot output"></i>结果 / 被消费方</span><span class="legendItem"><i class="legendDot focus"></i>当前焦点</span></div><div class="flowMeta">${state.selected?chip('当前焦点：'+(compById[state.selected]?.name||state.selected),'hot'):chip('点击任意节点开始探索','ok')}${state.graphScope==='focus'?chip('只显示一跳上下游') : chip('显示全图中的高价值零部件')}${chip('缩放：'+Math.round(state.graphZoom*100)+'%')}</div><div class="flowWrap"><svg id="flowSvg"></svg></div><p class="graphHint">如果工程很大，图里会优先展示连接度更高的零部件，避免新人一打开就被海量节点淹没。</p></div><aside class="card graphPanel" id="graphPanel"></aside></section>`;
const sel=document.getElementById('graphConfidence');sel.value=state.graphConfidence;sel.onchange=()=>{state.graphConfidence=sel.value;state.graphEdgeIndex=null;renderGraph()};
document.getElementById('zoomOutBtn').onclick=()=>{state.graphZoom=Math.max(.6, +(state.graphZoom-.2).toFixed(2));drawGraph()};
document.getElementById('zoomInBtn').onclick=()=>{state.graphZoom=Math.min(2.2, +(state.graphZoom+.2).toFixed(2));drawGraph()};
document.getElementById('zoomResetBtn').onclick=()=>{state.graphZoom=1;drawGraph()};
const ft=document.getElementById('focusToggleBtn'); if(ft) ft.onclick=()=>{state.graphScope=state.graphScope==='focus'?'all':'focus'; state.graphEdgeIndex=null; renderGraph()};
const cf=document.getElementById('clearFocusBtn'); if(cf) cf.onclick=()=>{state.selected=null; state.graphEdgeIndex=null; state.graphScope='all'; renderGraph(); renderNav()};
drawGraph();}
function nodeButton(id){const c=compById[id];if(!c)return '';return `<button class="nodeLink" data-goto-node="${esc(id)}">${esc(c.name)}<small>${esc(c.kind)} · ${esc(c.file)}:${esc(c.line)}</small></button>`}
function bindGraphPanel(){const panel=document.getElementById('graphPanel');if(!panel)return;panel.querySelectorAll('[data-goto-node]').forEach(btn=>btn.onclick=()=>setView('graph',btn.dataset.gotoNode));panel.querySelectorAll('[data-open-component]').forEach(btn=>btn.onclick=()=>setView('component',btn.dataset.openComponent));}
function updateGraphPanel(graphCtx){const panel=document.getElementById('graphPanel');if(!panel)return;const {comps,edges,indeg,outdeg}=graphCtx;const visible=new Set(comps.map(c=>c.id));if(state.selected && compById[state.selected]){const c=compById[state.selected];const incoming=(c.incoming||[]).filter(e=>visible.has(e.from));const outgoing=(c.outgoing||[]).filter(e=>visible.has(e.to));panel.innerHTML=`<div class="panelSplit"><div><h3>当前焦点：${esc(c.name)}</h3><p class="muted">${esc(c.role)}</p><div class="chips">${chip(c.kind)}${chip('in '+(indeg[c.id]||incoming.length))}${chip('out '+(outdeg[c.id]||outgoing.length))}${chip(c.file+':'+c.line)}</div></div><div><div class="tiny">声明</div><div class="evidence"><code>${esc(c.signature||'')}</code></div></div><div><div class="tiny">它依赖 / 调用了谁</div><div class="list">${outgoing.slice(0,8).map(e=>nodeButton(e.to)).join('')||'<div class="empty">当前图里没有更多下游。</div>'}</div></div><div><div class="tiny">谁依赖 / 调用了它</div><div class="list">${incoming.slice(0,8).map(e=>nodeButton(e.from)).join('')||'<div class="empty">当前图里没有更多上游。</div>'}</div></div><div><div class="tiny">公开方法预览</div><div class="list">${(c.methods||[]).slice(0,6).map(m=>`<div class="nodeLink"><strong>${esc(m.raw_name||m.name)}</strong><small>${esc(m.signature||'')}</small></div>`).join('')||'<div class="empty">暂无。</div>'}</div></div><div class="panelActionRow"><button class="soft" data-open-component="${esc(c.id)}">进入组件详情</button></div></div>`;bindGraphPanel();return;}
if(Number.isInteger(state.graphEdgeIndex)&&edges[state.graphEdgeIndex]){const e=edges[state.graphEdgeIndex];panel.innerHTML=`<div class="panelSplit"><div><h3>关系证据</h3><p class="muted">这条边不是脑补，而是扫描自源码中的一条关系。</p><div class="chips">${chip(e.type)}${chip(e.confidence,e.confidence==='unknown'||e.confidence==='runtime'?'warn':'ok')}${chip((compById[e.from]?.name||e.from)+' → '+(compById[e.to]?.name||e.to),'hot')}</div></div><div><div class="tiny">源码位置</div><p>${loc(e)}</p></div><div><div class="tiny">证据</div><div class="evidence"><code>${esc(e.evidence||'')}</code></div></div><div class="list">${nodeButton(e.from)}${nodeButton(e.to)}</div></div>`;bindGraphPanel();return;}
const starters=(data.components||[]).slice(0,6).map(c=>nodeButton(c.id)).join('');panel.innerHTML=`<div class="panelSplit"><div><h3>怎么玩这张图</h3><p class="muted">先点一个你认识的零部件，比如 Manager、Timer、Config。右侧会马上告诉你：它是谁、它依赖谁、谁又会依赖它。</p></div><div><div class="tiny">推荐起点</div><div class="list">${starters}</div></div><div><div class="tiny">推荐操作</div><div class="chips">${chip('点节点：看角色和上下游','ok')}${chip('点边：看源码证据')}${chip('只看它的一跳上下游')}${chip('进入组件详情')}</div></div></div>`;bindGraphPanel();}
function drawGraph(){const svg=document.getElementById('flowSvg');if(!svg)return;const {comps,edges}=getGraphData();const indeg=Object.fromEntries(comps.map(c=>[c.id,0]));const outdeg=Object.fromEntries(comps.map(c=>[c.id,0]));edges.forEach(e=>{indeg[e.to]=(indeg[e.to]||0)+1;outdeg[e.from]=(outdeg[e.from]||0)+1});const columns={entry:[],core:[],output:[]};comps.forEach(c=>columns[graphKind(c,indeg,outdeg)].push(c));['entry','core','output'].forEach(k=>columns[k].sort((a,b)=>((outdeg[b.id]+indeg[b.id])-(outdeg[a.id]+indeg[a.id]))||a.name.localeCompare(b.name)));const colMeta=[['entry','入口 / 发起'],['core','协调 / 核心'],['output','结果 / 被消费']];const pos={};const gapX=350,gapY=110,startX=50,startY=90,nodeW=270,nodeH=72;let maxRows=0;colMeta.forEach(([key],col)=>{maxRows=Math.max(maxRows, columns[key].length);columns[key].forEach((c,i)=>{pos[c.id]={x:startX+col*gapX,y:startY+i*gapY,w:nodeW,h:nodeH,group:key};})});const vbW=startX*2+(colMeta.length-1)*gapX+nodeW+70;const vbH=Math.max(620,startY+Math.max(1,maxRows)*gapY+70);svg.setAttribute('viewBox',`0 0 ${vbW} ${vbH}`);svg.style.width=`${Math.round(vbW*state.graphZoom)}px`;svg.style.height=`${Math.round(vbH*state.graphZoom)}px`;let html=`<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"></path></marker></defs>`;colMeta.forEach(([key,label],col)=>{const bandX=startX+col*gapX-18;html+=`<rect class="sectionBand" x="${bandX}" y="36" rx="18" width="${nodeW+36}" height="${vbH-72}"></rect><text class="sectionLabel" x="${bandX+18}" y="60">${esc(label)}</text>`});const selectedId=state.selected;const activeNeighborIds=new Set();if(selectedId){edges.forEach((e,idx)=>{if(e.from===selectedId||e.to===selectedId){activeNeighborIds.add(e.from);activeNeighborIds.add(e.to);}});activeNeighborIds.add(selectedId);}edges.forEach((e,idx)=>{const a=pos[e.from],b=pos[e.to];if(!a||!b)return;const x1=a.x+a.w,y1=a.y+a.h/2,x2=b.x,y2=b.y+b.h/2;const mid=Math.abs(x2-x1)/2;const mx1=x1+Math.max(40,mid*.55),mx2=x2-Math.max(40,mid*.55);const strong=(e.confidence==='direct'||e.confidence==='structural');const selected=state.graphEdgeIndex===idx;const dim=selectedId && !(e.from===selectedId||e.to===selectedId);const labelX=(x1+x2)/2;const labelY=(y1+y2)/2-6;html+=`<g><path class="edge ${strong?'strong':''} ${selected?'selected':''} ${dim?'dim':''}" data-edge="${idx}" d="M ${x1} ${y1} C ${mx1} ${y1}, ${mx2} ${y2}, ${x2} ${y2}"><title>${esc((compById[e.from]?.name||e.from)+' → '+(compById[e.to]?.name||e.to)+' ['+e.type+']')}</title></path><text class="edgeLabel ${dim?'dim':''}" x="${labelX}" y="${labelY}">${esc(e.type)}</text></g>`});comps.forEach(c=>{const p=pos[c.id];const name=c.name.length>28?c.name.slice(0,27)+'…':c.name;const kind=graphKind(c,indeg,outdeg);const selected=selectedId===c.id;const dim=selectedId && !activeNeighborIds.has(c.id);html+=`<g class="graphNode" data-id="${esc(c.id)}"><rect class="nodeRect kind-${kind} ${selected?'selected':''} ${dim?'dim':''}" x="${p.x}" y="${p.y}" rx="14" width="${p.w}" height="${p.h}"></rect><text class="nodeText ${dim?'dim':''}" x="${p.x+14}" y="${p.y+26}">${esc(name)}</text><text class="nodeSub ${dim?'dim':''}" x="${p.x+14}" y="${p.y+48}">${esc(c.kind)} · in ${indeg[c.id]||0} / out ${outdeg[c.id]||0}</text></g>`});svg.innerHTML=html;svg.querySelectorAll('.graphNode').forEach(g=>g.addEventListener('click',()=>{state.graphEdgeIndex=null;setView('graph',g.dataset.id)}));svg.querySelectorAll('[data-edge]').forEach(el=>el.addEventListener('click',ev=>{ev.stopPropagation();state.graphEdgeIndex=Number(el.dataset.edge);updateGraphPanel({comps,edges,indeg,outdeg});drawGraph();}));svg.onclick=()=>{};updateGraphPanel({comps,edges,indeg,outdeg});}
function renderRelations(){const rows=(data.edges||[]).slice(0,500).map(e=>`<tr><td>${chip(e.type)}</td><td>${chip(e.confidence,e.confidence==='unknown'||e.confidence==='runtime'?'warn':'ok')}</td><td><code>${esc(e.from)}</code></td><td><code>${esc(e.to)}</code></td><td>${loc(e)}</td><td class="mini">${esc(e.evidence||'')}</td></tr>`).join('');app.innerHTML=hero()+`<section class="section card"><h3>关系证据</h3><p class="muted">最多展示前 500 条。完整事实源请看 CODE_GRAPH.json。</p><table class="table"><tr><th>关系</th><th>置信度</th><th>From</th><th>To</th><th>位置</th><th>证据</th></tr>${rows}</table></section>`;}
function renderFiles(){const project=(data.project_files||[]).map(p=>`<tr><td><code>${esc(p.file)}</code></td><td>${esc(p.type)}</td><td>${esc(p.pod_name||p.name||'')}</td></tr>`).join('');const files=(data.files||[]).map(f=>`<tr><td><code>${esc(f)}</code></td></tr>`).join('');app.innerHTML=hero()+`<section class="section twoCol"><div class="card"><h3>工程配置</h3><table class="table"><tr><th>文件</th><th>类型</th><th>名称</th></tr>${project||'<tr><td colspan="3" class="muted">暂无。</td></tr>'}</table></div><div class="card"><h3>源码文件</h3><table class="table"><tr><th>文件</th></tr>${files}</table></div></section>`;}
function render(){renderNav();if(state.view==='component')renderComponent(state.selected);else if(state.view==='graph')renderGraph();else if(state.view==='relations')renderRelations();else if(state.view==='files')renderFiles();else renderOverview();}
readHash(false);
</script>
</body>
