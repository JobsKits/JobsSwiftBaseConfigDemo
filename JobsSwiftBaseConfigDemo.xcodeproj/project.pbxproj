			shellPath = /bin/zsh;
			shellScript = "# Xcode 自动构建阶段：在 CocoaPods 覆盖 Assets.car 后，重新合并主工程、Pods 资源和备用 App 图标。\n# 初始化非交互构建所需的 zsh 严格模式。\ninitialize_shell() {\n  set -euo pipefail\n  setopt NO_NOMATCH\n}\n# 收集 CocoaPods 既有图集和主工程 Icon Composer 资源。\ncollect_asset_inputs() {\n  typeset -ga JOBS_ASSET_INPUTS\n  JOBS_ASSET_INPUTS=()\n\n  local bmplayer_assets=\"${PODS_ROOT}/BMPlayer/Source/Pod_Asset_BMPlayer.xcassets\"\n  if [[ -d \"${bmplayer_assets}\" ]]; then\n    JOBS_ASSET_INPUTS+=(\"${bmplayer_assets}\")\n  fi\n\n  local asset_path=\"\"\n  while IFS= read -r -d '' asset_path; do\n    JOBS_ASSET_INPUTS+=(\"${asset_path}\")\n  done < <(\n    /usr/bin/find -L \"${SRCROOT}\" \\\n      \\( -path \"${PODS_ROOT}\" -o -name .git -o -name node_modules -o -name .dart_tool -o -name build -o -name DerivedData -o -name .build -o -name .DerivedDataUnity \\) -prune -o \\\n      -type d -name \"*.xcassets\" -print0\n  )\n\n  local icon_path=\"\"\n  while IFS= read -r -d '' icon_path; do\n    JOBS_ASSET_INPUTS+=(\"${icon_path}\")\n  done < <(\n    /usr/bin/find \"${SRCROOT}/JobsSwiftBaseConfigDemo/Resources/AppIcons\" \\\n      -maxdepth 1 -type d -name \"*.icon\" -print0\n  )\n\n  if (( ${#JOBS_ASSET_INPUTS[@]} == 0 )); then\n    echo \"error: 未找到可编译的 xcassets 或 Icon Composer 资源。\"\n    return 1\n  fi\n}\n# 根据当前 Target 构建 actool 参数，确保 Debug 和 Release 共用同一流程。\nbuild_actool_arguments() {\n  typeset -ga JOBS_ACTOOL_ARGUMENTS\n  JOBS_ACTOOL_ARGUMENTS=(\n    --output-format human-readable-text\n    --notices\n    --warnings\n    --platform \"${PLATFORM_NAME}\"\n    --minimum-deployment-target \"${IPHONEOS_DEPLOYMENT_TARGET}\"\n    --compress-pngs\n    --compile \"${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}\"\n    --app-icon \"${ASSETCATALOG_COMPILER_APPICON_NAME}\"\n    --output-partial-info-plist \"${TARGET_TEMP_DIR}/assetcatalog_generated_info_jobs_alternate_icons.plist\"\n  )\n\n  if [[ \",${TARGETED_DEVICE_FAMILY},\" == *,1,* ]]; then\n    JOBS_ACTOOL_ARGUMENTS+=(--target-device iphone)\n  fi\n  if [[ \",${TARGETED_DEVICE_FAMILY},\" == *,2,* ]]; then\n    JOBS_ACTOOL_ARGUMENTS+=(--target-device ipad)\n  fi\n\n  local alternate_icon_names=\"${ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES:-}\"\n  local icon_name=\"\"\n  local icon_count=0\n  for icon_name in ${=alternate_icon_names}; do\n    JOBS_ACTOOL_ARGUMENTS+=(--alternate-app-icon \"${icon_name}\")\n    icon_count=$((icon_count + 1))\n  done\n\n  if (( icon_count == 0 )); then\n    echo \"error: ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES 为空。\"\n    return 1\n  fi\n}\n# 在 CocoaPods 资源阶段之后生成包含备用图标的最终 Assets.car。\nrecompile_asset_catalog() {\n  echo \"▶︎ AppIcon：合并 ${#JOBS_ASSET_INPUTS[@]} 组资源并重新生成 Assets.car\"\n  /usr/bin/xcrun actool \"${JOBS_ACTOOL_ARGUMENTS[@]}\" \"${JOBS_ASSET_INPUTS[@]}\"\n  echo \"✅ AppIcon：备用图标已写入最终 Assets.car\"\n}\n# 编排 Xcode 非交互构建流程。\nmain() {\n  initialize_shell # 启用严格模式并避免空通配符中断资源扫描。\n  collect_asset_inputs # 汇总 CocoaPods 既有图集与主工程 Icon Composer 包。\n  build_actool_arguments # 绑定当前配置、设备族、主图标和全部备用图标名。\n  recompile_asset_catalog # 在 CocoaPods 覆盖后生成最终完整 Assets.car。\n}\n\nmain \"$@\"\n";
