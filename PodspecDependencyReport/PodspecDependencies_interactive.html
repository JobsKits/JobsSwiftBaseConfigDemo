    aside h3 { font-size: 14px; margin: 18px 0 8px; }

,"to_pod":"JobsSwiftBlock","to_external":null,"requirement":"","declared_in":"JobsToast","line":36,"file":"JobsByPods/JobsToast@Pods/JobsToast.podspec"},{"from":"JobsToast","to":"JobsSwiftBaseDefines","to_base":"JobsSwiftBaseDefines","to_pod":"JobsSwiftBaseDefines","to_external":null,"requirement":"","declared_in":"JobsToast","line":37,"file":"JobsByPods/JobsToast@Pods/JobsToast.podspec"},{"from":"FlutterPluginRegistrant","to":"Flutter","to_base":"Flutter","to_pod":"Flutter","to_external":null,"requirement":"","declared_in":"FlutterPluginRegistrant","line":21,"file":"my_flutter/.ios/Flutter/FlutterPluginRegistrant/FlutterPluginRegistrant.podspec"}],"internalCycles":[],"ignoredInternalSubspecDeps":[{"dep":"JobsNetworking","raw_dep":"JobsNetworking/Core","requirement":"","line":51,"declared_in":"JobsNetworking","raw_declared_in":"JobsNetworking/AF5","pod":"JobsNetworking","file":"/Users/jobs/Documents/Github/JobsBaseConfig/JobsBaseConfig@JobsSwiftBaseConfigDemo/JobsByPods/JobsNetworking@Pods/JobsNetworking.podspec"},{"dep":"JobsNetworking","raw_dep":"JobsNetworking/Core","requirement":"","line":58,"declared_in":"JobsNetworking","raw_declared_in":"JobsNetworking/AF4","pod":"JobsNetworking","file":"/Users/jobs/Documents/Github/JobsBaseConfig/JobsBaseConfig@JobsSwiftBaseConfigDemo/JobsByPods/JobsNetworking@Pods/JobsNetworking.podspec"},{"dep":"JobsNetworking","raw_dep":"JobsNetworking/Core","requirement":"","line":64,"declared_in":"JobsNetworking","raw_declared_in":"JobsNetworking/Async","pod":"JobsNetworking","file":"/Users/jobs/Documents/Github/JobsBaseConfig/JobsBaseConfig@JobsSwiftBaseConfigDemo/JobsByPods/JobsNetworking@Pods/JobsNetworking.podspec"},{"dep":"JobsNetworking","raw_dep":"JobsNetworking/Core","requirement":"","line":70,"declared_in":"JobsNetworking","raw_declared_in":"JobsNetworking/PromiseKit","pod":"JobsNetworking","file":"/Users/jobs/Documents/Github/JobsBaseConfig/JobsBaseConfig@JobsSwiftBaseConfigDemo/JobsByPods/JobsNetworking@Pods/JobsNetworking.podspec"}]};
    const state = {
      mode: 'internal',
      search: '',
      focus: null,
      depth: 1,
      scale: 1,
      tx: 20,
      ty: 20,
      nodes: [],
      edges: []
    };

    const stage = document.getElementById('stage');
    const canvas = document.getElementById('canvas');
    const svg = document.getElementById('svg');
    const edgesGroup = document.getElementById('edges');
    const nodesGroup = document.getElementById('nodes');

    document.getElementById('meta').textContent =
      `分析目录：${data.root} ｜ 生成时间：${data.generatedAt} ｜ Pod 数：${data.pods.length}`;

    function allEdges() {
      return state.mode === 'internal' ? data.internalEdges : data.allEdges;
    }

    function nodeNames() {
      const names = new Set(data.pods.map(p => p.name));
      allEdges().forEach(e => {
        names.add(e.from);
        names.add(e.to);
      });
      return [...names].sort();
    }

    function collectVisibleNames() {
      let names = new Set(nodeNames());
      const q = state.search.trim().toLowerCase();

      if (q) {
        names = new Set([...names].filter(n => n.toLowerCase().includes(q)));
        allEdges().forEach(e => {
          if (e.from.toLowerCase().includes(q) || e.to.toLowerCase().includes(q)) {
            names.add(e.from);
            names.add(e.to);
          }
        });
      }

      if (state.focus) {
        const visible = new Set([state.focus]);
        let frontier = new Set([state.focus]);

        for (let i = 0; i < state.depth; i++) {
          const next = new Set();
          allEdges().forEach(e => {
            if (frontier.has(e.from)) {
              next.add(e.to);
              visible.add(e.to);
            }
            if (frontier.has(e.to)) {
              next.add(e.from);
              visible.add(e.from);
            }
          });
          frontier = next;
        }

        names = visible;
      }

      return names;
    }

    function layout(names) {
      const arr = [...names].sort();
      const cols = Math.max(1, Math.ceil(Math.sqrt(arr.length)));
      const w = 210;
      const h = 90;

      return arr.map((name, i) => ({
        name,
        x: (i % cols) * w + 60,
        y: Math.floor(i / cols) * h + 60,
        width: 160,
        height: 38
      }));
    }

    function applyTransform() {
      canvas.style.transform = `translate(${state.tx}px, ${state.ty}px) scale(${state.scale})`;
    }

    function render() {
      const visibleNames = collectVisibleNames();
      state.nodes = layout(visibleNames);
      const nodeMap = new Map(state.nodes.map(n => [n.name, n]));

      state.edges = allEdges().filter(e => nodeMap.has(e.from) && nodeMap.has(e.to));

      edgesGroup.innerHTML = '';
      state.edges.forEach(e => {
        const a = nodeMap.get(e.from);
        const b = nodeMap.get(e.to);
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('class', 'edge');
        line.setAttribute('x1', a.x + a.width);
        line.setAttribute('y1', a.y + a.height / 2);
        line.setAttribute('x2', b.x);
        line.setAttribute('y2', b.y + b.height / 2);
        edgesGroup.appendChild(line);
      });

      nodesGroup.innerHTML = '';
      state.nodes.forEach(n => {
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('class', 'node' + (state.focus === n.name ? ' focus' : ''));
        g.setAttribute('transform', `translate(${n.x}, ${n.y})`);

        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('width', n.width);
        rect.setAttribute('height', n.height);

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', 10);
        text.setAttribute('y', 24);
        text.textContent = n.name.length > 22 ? n.name.slice(0, 21) + '…' : n.name;

        g.appendChild(rect);
        g.appendChild(text);

        g.addEventListener('click', event => {
          event.stopPropagation();
          state.focus = state.focus === n.name ? null : n.name;
          render();
        });

        nodesGroup.appendChild(g);
      });

      updateDetail();
    }

    function edgeTargetsName(edge, name) {
      return edge.to === name || edge.to_base === name || edge.to_pod === name || edge.to_external === name;
    }

    function sourceOwner(edge) {
      return edge.from || '';
    }

    function updateDetail() {
      const box = document.getElementById('detail');

      if (!state.focus) {
        const zero = data.pods.filter(p => !p.deps || p.deps.length === 0).map(p => p.name).sort();
        box.innerHTML = `
          <h2>总览</h2>
          <p><span class="badge">Pod ${data.pods.length}</span><span class="badge">边 ${allEdges().length}</span></p>
          <p class="muted">点击节点查看上下游依赖。</p>
          <h3>0 上游依赖 Pod</h3>
          <ul>${zero.map(n => `<li>${n}</li>`).join('')}</ul>
        `;
        return;
      }

      const deps = [...new Set(allEdges().filter(e => e.from === state.focus).map(e => e.to))].sort();
      const users = [...new Set(allEdges()
        .filter(e => edgeTargetsName(e, state.focus) && sourceOwner(e) !== state.focus)
        .map(e => e.from))].sort();

      box.innerHTML = `
        <h2>${state.focus}</h2>
        <ul class="direction-sections">
          <li>
            <strong>上游依赖</strong>
            <ul>${deps.length ? deps.map(n => `<li>${n}</li>`).join('') : '<li class="muted">无</li>'}</ul>
          </li>
          <li>
            <strong>下游依赖</strong>
            <ul>${users.length ? users.map(n => `<li>${n}</li>`).join('') : '<li class="muted">无</li>'}</ul>
          </li>
        </ul>
      `;
    }

    function fitView() {
      state.scale = 1;
      state.tx = 20;
      state.ty = 20;
      applyTransform();
    }

    document.getElementById('mode').addEventListener('change', e => {
      state.mode = e.target.value;
      state.focus = null;
      render();
      fitView();
    });

    document.getElementById('search').addEventListener('input', e => {
      state.search = e.target.value;
      state.focus = null;
      render();
      fitView();
    });

    document.getElementById('depth').addEventListener('change', e => {
      state.depth = Number(e.target.value);
      render();
    });

    document.getElementById('fit').addEventListener('click', fitView);

    document.getElementById('reset').addEventListener('click', () => {
      state.search = '';
      state.focus = null;
      state.depth = 1;
      document.getElementById('search').value = '';
      document.getElementById('depth').value = '1';
      render();
      fitView();
    });

    let dragging = false;
    let lastX = 0;
    let lastY = 0;

    stage.addEventListener('mousedown', e => {
      dragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
    });

    window.addEventListener('mousemove', e => {
      if (!dragging) return;
      state.tx += e.clientX - lastX;
      state.ty += e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;
      applyTransform();
    });

    window.addEventListener('mouseup', () => dragging = false);

    stage.addEventListener('wheel', e => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? 0.9 : 1.1;
      state.scale = Math.max(0.2, Math.min(3, state.scale * delta));
      applyTransform();
    }, { passive: false });

    render();
    fitView();
  </script>
